<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --green-accent: #00ff9d; 
            --dark-bg: #0d1117;
            --card-bg: #161b22;
        }

        body {
            margin: 0;
            padding: 10px; /* Небольшой отступ, чтобы тени не обрезались */
            background: transparent;
            display: flex;
            justify-content: center;
            overflow: hidden; /* КРИТИЧНО: убирает бегунок внутри iframe */
        }

        .velox-swap-widget {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--card-bg);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 16px;
            padding: 20px;
            width: 350px; /* Компактная ширина */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
            color: white;
        }

        .swap-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .swap-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--green-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 5px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: #8b949e;
            margin-bottom: 4px;
        }

        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-row input {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.3rem;
            width: 60%;
            outline: none;
        }

        .token-selector {
            background: #21262d;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #30363d;
        }

        .swap-arrow {
            text-align: center;
            margin: -12px 0;
            position: relative;
            z-index: 2;
        }

        .swap-arrow-btn {
            background: #161b22;
            border: 1px solid var(--green-accent);
            color: var(--green-accent);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 157, 0.2);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #8b949e;
            margin: 12px 0;
        }

        .connect-btn {
            width: 100%;
            background: var(--green-accent);
            border: none;
            border-radius: 12px;
            padding: 12px;
            color: #0a0b0d;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0, 255, 157, 0.3);
        }

        .connect-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 255, 157, 0.5);
        }

        .status-tag {
            font-size: 0.65rem;
            background: rgba(0, 255, 157, 0.1);
            color: var(--green-accent);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 157, 0.2);
        }
    </style>
</head>
<body>
    <div class="velox-swap-widget">
        <div class="swap-header">
            <h2>VELOX Swap</h2>
            <span class="status-tag">KRC-20 Live</span>
        </div>

        <div class="input-group">
            <label>Вы отдаете</label>
            <div class="input-row">
                <input type="number" id="pay-amount" placeholder="0.0">
                <div class="token-selector">KAS</div>
            </div>
        </div>

        <div class="swap-arrow">
            <button class="swap-arrow-btn">↓</button>
        </div>

        <div class="input-group">
            <label>Вы получаете</label>
            <div class="input-row">
                <input type="number" id="receive-amount" placeholder="0.0" readonly>
                <div class="token-selector" style="color: var(--green-accent);">VELOX</div>
            </div>
        </div>

        <div class="info-row">
            <span>Курс:</span>
            <span>1 KAS ≈ 100 VELOX</span>
        </div>

        <button class="connect-btn">Подключить кошелек</button>
    </div>
</body>
</html>
