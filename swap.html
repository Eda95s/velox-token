<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
    :root {
        --green-accent: #00ff9d; 
        --dark-bg: #0d1117;
        --card-bg: #161b22;
        --input-bg: rgba(0, 0, 0, 0.4);
    }

    body {
        margin: 0;
        padding: 0;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        height: 100vh; /* Центрируем по вертикали внутри фрейма */
    }

    /* ЖЕСТКОЕ УДАЛЕНИЕ СТРЕЛОЧЕК (Белого пятна) */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none !important;
        margin: 0 !important;
    }

    input[type=number] {
        -moz-appearance: textfield !important;
        appearance: none !important;
    }

    .velox-swap-widget {
        font-family: 'Segoe UI', Roboto, sans-serif;
        background-color: var(--card-bg);
        border: 1px solid rgba(0, 255, 157, 0.2);
        border-radius: 16px;
        padding: 20px;
        width: 350px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        box-sizing: border-box;
        color: white;
    }

    .swap-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .swap-header h2 {
        margin: 0;
        font-size: 1rem;
        color: var(--green-accent);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 800;
    }

    .input-group {
        background: var(--input-bg);
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 12px;
        transition: border-color 0.2s;
    }

    .input-group:focus-within {
        border-color: var(--green-accent);
    }

    .input-group label {
        display: block;
        font-size: 0.7rem;
        color: #8b949e;
        margin-bottom: 4px;
        text-transform: uppercase;
    }

    .input-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .input-row input {
        background: transparent;
        border: none;
        color: white;
        font-size: 1.4rem;
        width: 60%;
        outline: none; /* Убирает обводку при клике */
        font-family: 'Segoe UI', sans-serif;
        padding: 0;
    }

    .token-selector {
        background: #21262d;
        padding: 6px 14px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.85rem;
        border: 1px solid #30363d;
        color: #f0f6fc;
        user-select: none;
    }

    .swap-arrow {
        text-align: center;
        margin: -14px 0;
        position: relative;
        z-index: 2;
    }

    .swap-arrow-btn {
        background: #1c2128;
        border: 1px solid var(--green-accent);
        color: var(--green-accent);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        transition: 0.3s;
    }

    .swap-arrow-btn:hover {
        background: var(--green-accent);
        color: #0a0b0d;
    }

    .info-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: #8b949e;
        margin: 15px 4px;
    }

    .connect-btn {
        width: 100%;
        background: var(--green-accent);
        border: none;
        border-radius: 12px;
        padding: 15px;
        color: #0a0b0d;
        font-weight: 800;
        font-size: 0.9rem;
        cursor: pointer;
        transition: 0.3s;
        text-transform: uppercase;
        box-shadow: 0 4px 15px rgba(0, 255, 157, 0.2);
    }

    .connect-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 255, 157, 0.4);
        filter: brightness(1.1);
    }

    .status-tag {
        font-size: 0.6rem;
        background: rgba(0, 255, 157, 0.1);
        color: var(--green-accent);
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid rgba(0, 255, 157, 0.2);
    }
</style>
</head>
<body>
    <div class="velox-swap-widget">
        <div class="swap-header">
            <h2>VELOX Swap</h2>
            <span class="status-tag">KRC-20 Live</span>
        </div>

        <div class="input-group">
            <label>Вы отдаете</label>
            <div class="input-row">
                <input type="number" id="pay-amount" placeholder="0.0" step="any">
                <div class="token-selector">KAS</div>
            </div>
        </div>

        <div class="swap-arrow">
            <div class="swap-arrow-btn">↓</div>
        </div>

        <div class="input-group">
            <label>Вы получаете</label>
            <div class="input-row">
                <input type="number" id="receive-amount" placeholder="0.0" readonly>
                <div class="token-selector" style="color: var(--green-accent); border-color: var(--green-accent);">VELOX</div>
            </div>
        </div>

        <div class="info-row">
            <span>Курс:</span>
            <span>1 KAS ≈ 100 VELOX</span>
        </div>

        <button class="connect-btn">Подключить кошелек</button>
    </div>

    <script>
        const payInput = document.getElementById('pay-amount');
        const receiveInput = document.getElementById('receive-amount');
        const rate = 100;

        payInput.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (!isNaN(val)) {
                receiveInput.value = (val * rate).toFixed(2);
            } else {
                receiveInput.value = '';
            }
        });
    </script>
</body>
</html>
