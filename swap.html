<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
    :root {
        --green-accent: #00ff9d; 
        --card-bg: #161b22;
        --text-secondary: #8b949e;
    }

    body {
        margin: 0; padding: 0; background: transparent;
        display: flex; justify-content: center; overflow: hidden;
    }

    /* УБИРАЕМ СТРЕЛКИ */
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
        -webkit-appearance: none !important; margin: 0 !important;
    }
    input[type=number] { -moz-appearance: textfield !important; appearance: none !important; }

    .velox-swap-widget {
        font-family: 'Segoe UI', sans-serif;
        background-color: var(--card-bg);
        border: 1px solid rgba(0, 255, 157, 0.2);
        border-radius: 16px;
        padding: 20px;
        width: 350px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        box-sizing: border-box;
        color: white;
    }

    .swap-header {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
    }

    .swap-header h2 { margin: 0; font-size: 1.1rem; color: var(--green-accent); text-transform: uppercase; }

    .input-group {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 5px;
    }

    .label-row {
        display: flex; justify-content: space-between;
        font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px;
    }

    .input-row { display: flex; justify-content: space-between; align-items: center; }

    .input-row input {
        background: transparent; border: none; color: white;
        font-size: 1.4rem; width: 60%; outline: none !important;
    }

    .token-selector {
        background: #21262d; padding: 6px 12px; border-radius: 20px;
        font-weight: bold; font-size: 0.9rem; border: 1px solid #30363d;
    }

    .swap-arrow { text-align: center; margin: -14px 0; position: relative; z-index: 2; }
    .swap-arrow-btn {
        background: var(--card-bg); border: 1px solid var(--green-accent);
        color: var(--green-accent); border-radius: 50%;
        width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
    }

    .info-row {
        display: flex; justify-content: space-between;
        font-size: 0.8rem; color: var(--text-secondary); margin: 15px 0;
    }

    .connect-btn {
        width: 100%; background: var(--green-accent); border: none;
        border-radius: 12px; padding: 14px; color: #0a0b0d;
        font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s;
    }

    .status-tag {
        font-size: 0.65rem; background: rgba(0, 255, 157, 0.1);
        color: var(--green-accent); padding: 2px 8px; border-radius: 4px;
    }
    </style>
</head>
<body>
    <div class="velox-swap-widget">
        <div class="swap-header">
            <h2>VELOX Swap</h2>
            <span class="status-tag">KRC-20 Live</span>
        </div>

        <div class="input-group">
            <div class="label-row">
                <span>Вы отдаете</span>
                <span id="kas-balance">Баланс: 0.00</span>
            </div>
            <div class="input-row">
                <input type="number" id="pay-amount" placeholder="0.0">
                <div class="token-selector">KAS</div>
            </div>
        </div>

        <div class="swap-arrow"><div class="swap-arrow-btn">↓</div></div>

        <div class="input-group">
            <div class="label-row">
                <span>Вы получаете</span>
            </div>
            <div class="input-row">
                <input type="number" id="receive-amount" placeholder="0.0">
                <div class="token-selector" style="color: var(--green-accent);">VELOX</div>
            </div>
        </div>

        <div class="info-row">
            <span>Курс:</span>
            <span>1 KAS ≈ 100 VELOX</span>
        </div>

        <button class="connect-btn" id="wallet-btn">Подключить кошелек</button>
    </div>

    <script>
    const payInput = document.getElementById('pay-amount');
    const receiveInput = document.getElementById('receive-amount');
    const walletBtn = document.getElementById('wallet-btn');
    const balanceDisplay = document.getElementById('kas-balance');
    const rate = 100;

    // Калькулятор
    payInput.addEventListener('input', () => {
        receiveInput.value = payInput.value ? (parseFloat(payInput.value) * rate).toFixed(2) : '';
    });
    receiveInput.addEventListener('input', () => {
        payInput.value = receiveInput.value ? (parseFloat(receiveInput.value) / rate).toFixed(2) : '';
    });

    // Функция получения баланса
    async function updateBalance(provider) {
        try {
            const balanceData = await provider.getBalance();
            // Делим на 10^8 (стандарт Kaspa для перевода из сомми в KAS)
            const totalKas = (balanceData.total / 100000000).toFixed(2);
            balanceDisplay.innerText = `Баланс: ${totalKas} KAS`;
        } catch (e) {
            console.error("Ошибка при получении баланса:", e);
        }
    }

    // Работа с кошельком
    async function connectWallet() {
        // Проверяем наличие провайдеров
        const provider = window.kasware || (window.okxwallet && window.okxwallet.kaspa);
        
        if (provider) {
            try {
                walletBtn.innerText = 'Ожидание...';
                // Запрашиваем доступ к аккаунту
                const accounts = await provider.requestAccounts();
                
                if (accounts && accounts.length > 0) {
                    const addr = accounts[0];
                    // Красивое отображение адреса
                    walletBtn.innerText = addr.substring(0, 9) + '...' + addr.slice(-4);
                    walletBtn.style.background = 'rgba(0, 255, 157, 0.1)';
                    walletBtn.style.color = '#00ff9d';
                    walletBtn.style.border = '1px solid #00ff9d';
                    
                    // Сразу обновляем баланс
                    await updateBalance(provider);
                }
            } catch (e) {
                walletBtn.innerText = 'Отказ';
                console.error("Ошибка подключения:", e);
                setTimeout(() => { walletBtn.innerText = 'Подключить кошелек'; }, 2000);
            }
        } else {
            // Если кошелька нет, выводим то самое окно
            alert('Кошелек не обнаружен. Пожалуйста, установите KasWare Wallet или OKX Wallet и обновите страницу.');
            window.open('https://www.kasware.info/', '_blank');
        }
    }

    walletBtn.addEventListener('click', connectWallet);
</script>
</body>
</html>
